<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Agent Memory from Scratch 中文电子书"><title>搜索 · Agent Memory from Scratch</title><link rel="stylesheet" href="assets/wiki.css"></head><body><a class="skip" href="#main">跳到正文</a><div class="shell"><header class="topbar"><a class="brand" href="index.html">Agent Memory</a><span class="spacer"></span><a class="control hide-mobile" href="search.html">搜索</a><button class="control" data-size="-1" aria-label="减小字号">A−</button><button class="control" data-size="1" aria-label="增大字号">A＋</button></header><main id="main" class="search"><div class="eyebrow">全书搜索</div><h1 class="chapter-title">搜索</h1><input class="search-input" type="search" autofocus placeholder="Mem0 / Graphiti / 遗忘" aria-label="搜索电子书"><p class="search-hint" id="search-status" aria-live="polite">输入概念、项目或机制，例如 Mem0、Graphiti、遗忘。</p><div id="results"></div></main></div><script src="assets/search-index.js"></script><script>(()=>{const d=window.BOOK_SEARCH||[];const i=document.querySelector('.search-input'),o=document.querySelector('#results'),s=document.querySelector('#search-status');function run(){const q=i.value.trim().toLowerCase();o.replaceChildren();if(!q){s.textContent='输入概念、项目或机制，例如 Mem0、Graphiti、遗忘。';return}const hits=d.map(x=>({...x,pos:(x.title+' '+x.text).toLowerCase().indexOf(q)})).filter(x=>x.pos>=0).slice(0,30);s.textContent=hits.length?'找到 '+hits.length+' 章':'没有匹配结果，换个更短的说法，或清空后浏览目录。';for(const x of hits){const row=document.createElement('article');row.className='result';const a=document.createElement('a');a.href='chapters/'+x.slug+'.html';a.textContent=x.title;const p=document.createElement('p');const st=Math.max(0,x.pos-70);p.textContent=x.text.slice(st,st+220).replace(/^[，。；：、,.;:!?！？\s]+/,'');row.append(a,p);o.append(row)}}i.addEventListener('input',run);run()})()</script><script src="assets/wiki.js"></script></body></html>
