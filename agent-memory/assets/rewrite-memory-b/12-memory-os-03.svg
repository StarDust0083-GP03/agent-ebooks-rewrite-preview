<text x="700" y="132" class="value">可降权但须保护</text>
<rect x="24" y="188" width="1032" height="76" rx="5" fill="#e9edf1"/>
<text x="38" y="220" class="label">旧许可</text>
<text x="320" y="220" class="value">职务已经结束</text>
<text x="700" y="220" class="value">当前日期必须排除</text>
<rect x="24" y="276" width="1032" height="76" rx="5" fill="#e8eee9"/>
<text x="38" y="308" class="label">错误提醒</text>
<text x="320" y="308" class="value">已被材料纠正</text>
<text x="700" y="308" class="value">需改语义而非只衰减</text>
