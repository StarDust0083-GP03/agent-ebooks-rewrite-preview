<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="392" viewBox="0 0 1080 392" role="img" aria-labelledby="title"><title id="title">候选判断只负责管线中一段</title>
<style>text{font-family:system-ui,"Noto Sans CJK SC",sans-serif;fill:#203342}.head{font-size:24px;font-weight:650}.label{font-size:18px;font-weight:600}.value{font-size:18px}.small{font-size:15px;fill:#526571}</style>
<rect width="1080" height="392" fill="#faf8f1"/>
<text x="30" y="40" class="head">候选判断只负责管线中一段</text>
<text x="32" y="80" class="small">观察对象</text><text x="320" y="80" class="small">输入或当前状态</text><text x="700" y="80" class="small">应核对的结果</text>
<rect x="24" y="100" width="1032" height="76" rx="5" fill="#e8eee9"/>
<text x="38" y="132" class="label">上游</text>
<text x="320" y="132" class="value">BM25 / 向量 / 图</text>
<text x="700" y="132" class="value">提供已授权候选</text>
<rect x="24" y="188" width="1032" height="76" rx="5" fill="#e9edf1"/>
<text x="38" y="220" class="label">本段</text>
<text x="320" y="220" class="value">本地检查 + 小决策</text>
<text x="700" y="220" class="value">选择与状态，不造证据</text>
<rect x="24" y="276" width="1032" height="76" rx="5" fill="#e8eee9"/>
<text x="38" y="308" class="label">下游</text>
<text x="320" y="308" class="value">统一打包与工具执行</text>
<text x="700" y="308" class="value">核对来源并执行硬权限</text>
</svg>