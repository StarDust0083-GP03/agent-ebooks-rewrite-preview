<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="392" viewBox="0 0 1080 392" role="img" aria-labelledby="title"><title id="title">十题回归先覆盖不同失败</title>
<style>text{font-family:system-ui,"Noto Sans CJK SC",sans-serif;fill:#203342}.head{font-size:24px;font-weight:650}.label{font-size:18px;font-weight:600}.value{font-size:18px}.small{font-size:15px;fill:#526571}</style>
<rect width="1080" height="392" fill="#faf8f1"/>
<text x="30" y="40" class="head">十题回归先覆盖不同失败</text>
<text x="32" y="80" class="small">观察对象</text><text x="320" y="80" class="small">输入或当前状态</text><text x="700" y="80" class="small">应核对的结果</text>
<rect x="24" y="100" width="1032" height="76" rx="5" fill="#e8eee9"/>
<text x="38" y="132" class="label">语义题</text>
<text x="320" y="132" class="value">单位 / 例外 / 未来变更</text>
<text x="700" y="132" class="value">检查字段和条件</text>
<rect x="24" y="188" width="1032" height="76" rx="5" fill="#e9edf1"/>
<text x="38" y="220" class="label">证据题</text>
<text x="320" y="220" class="value">编号 / 两跳 / 缺资料</text>
<text x="700" y="220" class="value">检查来源与拒答</text>
<rect x="24" y="276" width="1032" height="76" rx="5" fill="#e8eee9"/>
<text x="38" y="308" class="label">治理题</text>
<text x="320" y="308" class="value">同名 / 撤权 / 删除</text>
<text x="700" y="308" class="value">检查实际候选和副本</text>
</svg>