<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="392" viewBox="0 0 1080 392" role="img" aria-labelledby="title"><title id="title">撤回机制也要清理副作用</title>
<style>text{font-family:system-ui,"Noto Sans CJK SC",sans-serif;fill:#203342}.head{font-size:24px;font-weight:650}.label{font-size:18px;font-weight:600}.value{font-size:18px}.small{font-size:15px;fill:#526571}</style>
<rect width="1080" height="392" fill="#faf8f1"/>
<text x="30" y="40" class="head">撤回机制也要清理副作用</text>
<text x="32" y="80" class="small">观察对象</text><text x="320" y="80" class="small">输入或当前状态</text><text x="700" y="80" class="small">应核对的结果</text>
<rect x="24" y="100" width="1032" height="76" rx="5" fill="#e8eee9"/>
<text x="38" y="132" class="label">评分无收益</text>
<text x="320" y="132" class="value">费用增加但漏项不减</text>
<text x="700" y="132" class="value">回到审核事实</text>
<rect x="24" y="188" width="1032" height="76" rx="5" fill="#e9edf1"/>
<text x="38" y="220" class="label">图误合并</text>
<text x="320" y="220" class="value">串馆风险上升</text>
<text x="700" y="220" class="value">缩小自动化范围</text>
<rect x="24" y="276" width="1032" height="76" rx="5" fill="#e8eee9"/>
<text x="38" y="308" class="label">实验残留</text>
<text x="320" y="308" class="value">摘要、强化与缓存</text>
<text x="700" y="308" class="value">不能继续污染基线</text>
</svg>