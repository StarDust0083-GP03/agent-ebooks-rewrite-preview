<rect x="24" y="188" width="1032" height="76" rx="5" fill="#e9edf1"/>
<text x="38" y="220" class="label">服务身份</text>
<text x="320" y="220" class="value">已认证 caller</text>
<text x="700" y="220" class="value">决定用户与 groups</text>
<rect x="24" y="276" width="1032" height="76" rx="5" fill="#e8eee9"/>
<text x="38" y="308" class="label">读取对象</text>
