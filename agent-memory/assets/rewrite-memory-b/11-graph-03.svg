<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="392" viewBox="0 0 1080 392" role="img" aria-labelledby="title"><title id="title">结构类型限制不了全部语义</title>
<style>text{font-family:system-ui,"Noto Sans CJK SC",sans-serif;fill:#203342}.head{font-size:24px;font-weight:650}.label{font-size:18px;font-weight:600}.value{font-size:18px}.small{font-size:15px;fill:#526571}</style>
<rect width="1080" height="392" fill="#faf8f1"/>
<text x="30" y="40" class="head">结构类型限制不了全部语义</text>
<text x="32" y="80" class="small">观察对象</text><text x="320" y="80" class="small">输入或当前状态</text><text x="700" y="80" class="small">应核对的结果</text>
<rect x="24" y="100" width="1032" height="76" rx="5" fill="#e8eee9"/>
<text x="38" y="132" class="label">端点类型</text>
<text x="320" y="132" class="value">Department → Person</text>
<text x="700" y="132" class="value">形状可以合法</text>
<rect x="24" y="188" width="1032" height="76" rx="5" fill="#e9edf1"/>
<text x="38" y="220" class="label">关系用途</text>
<text x="320" y="220" class="value">修复签收 / 外借许可</text>
<text x="700" y="220" class="value">必须保留类别</text>
<rect x="24" y="276" width="1032" height="76" rx="5" fill="#e8eee9"/>
<text x="38" y="308" class="label">来源检查</text>
<text x="320" y="308" class="value">原始规程限定</text>
<text x="700" y="308" class="value">确认适用于此藏品</text>
</svg>