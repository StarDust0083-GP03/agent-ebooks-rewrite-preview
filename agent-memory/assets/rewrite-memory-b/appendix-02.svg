<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">池外与池内失败的区分</title><desc id="desc">语义初选：R2、R8；全文命中：R5、R2；正确要求是 R5；关键差别：候选并集有 R5，池内加分没有</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">池外与池内失败的区分</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">语义初选</text><text x="270" y="139" font-size="18" fill="#243b48">R2、R8</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">全文命中</text><text x="270" y="239" font-size="18" fill="#243b48">R5、R2；正确要求是 R5</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">关键差别</text><text x="270" y="339" font-size="18" fill="#243b48">候选并集有 R5，池内加分没有</text></g></svg>
