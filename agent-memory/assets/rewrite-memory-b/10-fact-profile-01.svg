<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="392" viewBox="0 0 1080 392" role="img" aria-labelledby="title"><title id="title">同一封登记邮件的两类读取</title>
<style>text{font-family:system-ui,"Noto Sans CJK SC",sans-serif;fill:#203342}.head{font-size:24px;font-weight:650}.label{font-size:18px;font-weight:600}.value{font-size:18px}.small{font-size:15px;fill:#526571}</style>
<rect width="1080" height="392" fill="#faf8f1"/>
<text x="30" y="40" class="head">同一封登记邮件的两类读取</text>
<text x="32" y="80" class="small">观察对象</text><text x="320" y="80" class="small">输入或当前状态</text><text x="700" y="80" class="small">应核对的结果</text>
<rect x="24" y="100" width="1032" height="76" rx="5" fill="#e8eee9"/>
<text x="38" y="132" class="label">清单格式</text>
<text x="320" y="132" class="value">编号排序 / 毫米</text>
<text x="700" y="132" class="value">按用户读取现行约定</text>
<rect x="24" y="188" width="1032" height="76" rx="5" fill="#e9edf1"/>
<text x="38" y="220" class="label">装箱经历</text>
<text x="320" y="220" class="value">缓冲层遗漏报告</text>
<text x="700" y="220" class="value">按事件查证据</text>
<rect x="24" y="276" width="1032" height="76" rx="5" fill="#e8eee9"/>
<text x="38" y="308" class="label">错误边界</text>
<text x="320" y="308" class="value">外馆同事的做法</text>
<text x="700" y="308" class="value">不归为周岚偏好</text>
</svg>