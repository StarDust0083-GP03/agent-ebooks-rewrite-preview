<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">规则回放的继续与停止</title><desc id="desc">覆盖实验日：具备其他条件才继续；证书先到期：停止提交并说明缺口；演示 / 其他资产：不提交 / 读取各自规程</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">规则回放的继续与停止</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">覆盖实验日</text><text x="270" y="139" font-size="18" fill="#243b48">具备其他条件才继续</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">证书先到期</text><text x="270" y="239" font-size="18" fill="#243b48">停止提交并说明缺口</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">演示 / 其他资产</text><text x="270" y="339" font-size="18" fill="#243b48">不提交 / 读取各自规程</text></g></svg>
