<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">记录字段对应的读取问题</title><desc id="desc">主体与资产：是谁、哪台设备，防止同名串线；来源与时间：谁提出、何时适用、可否回查；状态与版本：本次临时限制还是长期要求</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">记录字段对应的读取问题</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">主体与资产</text><text x="270" y="139" font-size="18" fill="#243b48">是谁、哪台设备，防止同名串线</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">来源与时间</text><text x="270" y="239" font-size="18" fill="#243b48">谁提出、何时适用、可否回查</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">状态与版本</text><text x="270" y="339" font-size="18" fill="#243b48">本次临时限制还是长期要求</text></g></svg>
