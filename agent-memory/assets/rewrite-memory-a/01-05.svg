<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">对照调用与当前核验</title><desc id="desc">无记忆对照：相同预约请求，不加旧要求；带记忆对照：要求实际进入消息；验收结果：是否增加当前证书查询，而非只说记住</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">对照调用与当前核验</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">无记忆对照</text><text x="270" y="139" font-size="18" fill="#243b48">相同预约请求，不加旧要求</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">带记忆对照</text><text x="270" y="239" font-size="18" fill="#243b48">要求实际进入消息</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">验收结果</text><text x="270" y="339" font-size="18" fill="#243b48">是否增加当前证书查询，而非只说记住</text></g></svg>
