<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">按未来用途选择记忆单位</title><desc id="desc">偏好：直接可读字段，允许本次覆盖；经历：保留时间、过程和结果；规则：明确资产、触发与条件，不抹去来源</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">按未来用途选择记忆单位</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">偏好</text><text x="270" y="139" font-size="18" fill="#243b48">直接可读字段，允许本次覆盖</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">经历</text><text x="270" y="239" font-size="18" fill="#243b48">保留时间、过程和结果</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">规则</text><text x="270" y="339" font-size="18" fill="#243b48">明确资产、触发与条件，不抹去来源</text></g></svg>
