<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">三种架构的选择位置</title><desc id="desc">事实与画像：查回短陈述或直接读取属性；关系结构：通过同一实验室连接通知；主动读取：模型提议工具，宿主限制范围</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">三种架构的选择位置</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">事实与画像</text><text x="270" y="139" font-size="18" fill="#243b48">查回短陈述或直接读取属性</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">关系结构</text><text x="270" y="239" font-size="18" fill="#243b48">通过同一实验室连接通知</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">主动读取</text><text x="270" y="339" font-size="18" fill="#243b48">模型提议工具，宿主限制范围</text></g></svg>
