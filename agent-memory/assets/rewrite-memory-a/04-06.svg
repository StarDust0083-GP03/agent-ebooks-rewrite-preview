<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">函数调用的可检查断面</title><desc id="desc">保存：输入清理与数据库事务；检索：权限、区间、分数和强化分开看；组装：预算限制内容，不取代业务核验</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">函数调用的可检查断面</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">保存</text><text x="270" y="139" font-size="18" fill="#243b48">输入清理与数据库事务</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">检索</text><text x="270" y="239" font-size="18" fill="#243b48">权限、区间、分数和强化分开看</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">组装</text><text x="270" y="339" font-size="18" fill="#243b48">预算限制内容，不取代业务核验</text></g></svg>
