<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">默认交接与演示安排验收</title><desc id="desc">长期候选：11 月 1 日起顾宁复核普通预约；任务候选：本周演示找周岚，不提交；核对条件：人物正确仍不够，日期与用途也要对</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">默认交接与演示安排验收</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">长期候选</text><text x="270" y="139" font-size="18" fill="#243b48">11 月 1 日起顾宁复核普通预约</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">任务候选</text><text x="270" y="239" font-size="18" fill="#243b48">本周演示找周岚，不提交</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">核对条件</text><text x="270" y="339" font-size="18" fill="#243b48">人物正确仍不够，日期与用途也要对</text></g></svg>
