<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">文本恢复与业务补偿</title><desc id="desc">回滚文件：改变未来使用的规则版本；已发通知：现实动作不会自动撤销；恢复计划：存储状态与外部结果分别核对</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">文本恢复与业务补偿</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">回滚文件</text><text x="270" y="139" font-size="18" fill="#243b48">改变未来使用的规则版本</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">已发通知</text><text x="270" y="239" font-size="18" fill="#243b48">现实动作不会自动撤销</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">恢复计划</text><text x="270" y="339" font-size="18" fill="#243b48">存储状态与外部结果分别核对</text></g></svg>
