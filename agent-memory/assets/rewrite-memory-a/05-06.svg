<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">重排与实际装入是两次选择</title><desc id="desc">重排输入：只能判断传来的候选；剩余额度：240 token；A 70、B 190；组装取舍：合计 260 超额，需缩减或调整</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">重排与实际装入是两次选择</text><circle cx="58" cy="130" r="22" fill="#285d75"/><text x="52" y="137" font-size="21" fill="white">1</text><rect x="105" y="100" width="745" height="85" fill="#e8ede7"/><text x="122" y="128" font-size="19" fill="#243b48">重排输入</text><text x="122" y="157" font-size="18" fill="#243b48">只能判断传来的候选</text><path d="M58 153 V182" stroke="#285d75" stroke-width="2"/><path d="M52 176 L58 185 L64 176" fill="none" stroke="#285d75" stroke-width="2"/><circle cx="58" cy="235" r="22" fill="#285d75"/><text x="52" y="242" font-size="21" fill="white">2</text><rect x="105" y="205" width="745" height="85" fill="#e8ede7"/><text x="122" y="233" font-size="19" fill="#243b48">剩余额度</text><text x="122" y="262" font-size="18" fill="#243b48">240 token；A 70、B 190</text><path d="M58 258 V287" stroke="#285d75" stroke-width="2"/><path d="M52 281 L58 290 L64 281" fill="none" stroke="#285d75" stroke-width="2"/><circle cx="58" cy="340" r="22" fill="#285d75"/><text x="52" y="347" font-size="21" fill="white">3</text><rect x="105" y="310" width="745" height="85" fill="#e8ede7"/><text x="122" y="338" font-size="19" fill="#243b48">组装取舍</text><text x="122" y="367" font-size="18" fill="#243b48">合计 260 超额，需缩减或调整</text></g></svg>
