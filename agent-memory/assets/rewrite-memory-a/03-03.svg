<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">多份转发与同一事实</title><desc id="desc">完全重复：同一正文可用 hash 辅助识别；独立来源：相同事实仍可保留多份依据；语义去重：换措辞后需核对主体、用途和日期</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">多份转发与同一事实</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">完全重复</text><text x="270" y="139" font-size="18" fill="#243b48">同一正文可用 hash 辅助识别</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">独立来源</text><text x="270" y="239" font-size="18" fill="#243b48">相同事实仍可保留多份依据</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">语义去重</text><text x="270" y="339" font-size="18" fill="#243b48">换措辞后需核对主体、用途和日期</text></g></svg>
