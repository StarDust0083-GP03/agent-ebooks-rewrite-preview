<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">完整窗口的预留与成组证据</title><desc id="desc">总窗 12000：系统工具 3000，当前 2500；未来预留：回答 2000，工具往返 2500；记忆余额：2000；关联证据需保留完整条件</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">完整窗口的预留与成组证据</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">总窗 12000</text><text x="270" y="139" font-size="18" fill="#243b48">系统工具 3000，当前 2500</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">未来预留</text><text x="270" y="239" font-size="18" fill="#243b48">回答 2000，工具往返 2500</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">记忆余额</text><text x="270" y="339" font-size="18" fill="#243b48">2000；关联证据需保留完整条件</text></g></svg>
