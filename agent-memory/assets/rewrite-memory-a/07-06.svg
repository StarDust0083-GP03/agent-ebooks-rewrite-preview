<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">只读要求被误写成实际操作</title><desc id="desc">原要求：检查证书覆盖实验日；错误压缩：每次预约前重新校准；差异：动词和副作用扩大，不能按主题词通过</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">只读要求被误写成实际操作</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">原要求</text><text x="270" y="139" font-size="18" fill="#243b48">检查证书覆盖实验日</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">错误压缩</text><text x="270" y="239" font-size="18" fill="#243b48">每次预约前重新校准</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">差异</text><text x="270" y="339" font-size="18" fill="#243b48">动词和副作用扩大，不能按主题词通过</text></g></svg>
