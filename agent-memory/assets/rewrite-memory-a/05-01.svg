<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">三条记录在各阶段的命运</title><desc id="desc">A：S7 和 certificate_check，直接相关；B：不同措辞的校准要求，可能漏召回；C：参观讲解位置，同资产却与预约无关</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">三条记录在各阶段的命运</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">A</text><text x="270" y="139" font-size="18" fill="#243b48">S7 和 certificate_check，直接相关</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">B</text><text x="270" y="239" font-size="18" fill="#243b48">不同措辞的校准要求，可能漏召回</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">C</text><text x="270" y="339" font-size="18" fill="#243b48">参观讲解位置，同资产却与预约无关</text></g></svg>
