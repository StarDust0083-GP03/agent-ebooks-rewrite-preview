<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">独立陈述与局部纠正</title><desc id="desc">今天不提交：绑定日期和演示任务；证书要求：持续作用于相关真实申请；替代边界：临时例外不关闭长期规则</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">独立陈述与局部纠正</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">今天不提交</text><text x="270" y="139" font-size="18" fill="#243b48">绑定日期和演示任务</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">证书要求</text><text x="270" y="239" font-size="18" fill="#243b48">持续作用于相关真实申请</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">替代边界</text><text x="270" y="339" font-size="18" fill="#243b48">临时例外不关闭长期规则</text></g></svg>
