<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">任务例外叠加长期默认</title><desc id="desc">普通预约：11 月起由顾宁复核；本周演示：周岚对接，但不提交；不同职责：维护与预约不可因人名不同互相关闭</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">任务例外叠加长期默认</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">普通预约</text><text x="270" y="139" font-size="18" fill="#243b48">11 月起由顾宁复核</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">本周演示</text><text x="270" y="239" font-size="18" fill="#243b48">周岚对接，但不提交</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">不同职责</text><text x="270" y="339" font-size="18" fill="#243b48">维护与预约不可因人名不同互相关闭</text></g></svg>
