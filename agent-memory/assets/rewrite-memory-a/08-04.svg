<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">经验成为技能还缺什么</title><desc id="desc">输入与触发：资产、实验时间、主体与真实授权；工具与停止：查规程、资格、证书；缺项即停；验收：只读演示不提交，合规申请仍能继续</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">经验成为技能还缺什么</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">输入与触发</text><text x="270" y="139" font-size="18" fill="#243b48">资产、实验时间、主体与真实授权</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">工具与停止</text><text x="270" y="239" font-size="18" fill="#243b48">查规程、资格、证书；缺项即停</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">验收</text><text x="270" y="339" font-size="18" fill="#243b48">只读演示不提交，合规申请仍能继续</text></g></svg>
