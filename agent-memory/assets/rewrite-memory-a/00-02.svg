<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">同一通知的三种对象</title><desc id="desc">材料 D2：收到的通知，保留原文；实体 I7：具体校区的 S7，不只靠名称；关系 G4：管理事实，指回支持材料</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">同一通知的三种对象</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">材料 D2</text><text x="270" y="139" font-size="18" fill="#243b48">收到的通知，保留原文</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">实体 I7</text><text x="270" y="239" font-size="18" fill="#243b48">具体校区的 S7，不只靠名称</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">关系 G4</text><text x="270" y="339" font-size="18" fill="#243b48">管理事实，指回支持材料</text></g></svg>
