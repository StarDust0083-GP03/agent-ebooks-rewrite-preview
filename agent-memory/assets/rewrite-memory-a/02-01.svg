<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">一条消息的用途分解</title><desc id="desc">稳定约定：通常发邮件提醒；本次限制：只演示，不提交；过去经历与流程：保留退回事件，提炼日期检查</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">一条消息的用途分解</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">稳定约定</text><text x="270" y="139" font-size="18" fill="#243b48">通常发邮件提醒</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">本次限制</text><text x="270" y="239" font-size="18" fill="#243b48">只演示，不提交</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">过去经历与流程</text><text x="270" y="339" font-size="18" fill="#243b48">保留退回事件，提炼日期检查</text></g></svg>
