<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">关系正确需要同时核对四项</title><desc id="desc">身份与用途：同一资产、同一职责，避免误合并；有效与获知：现实何时变化，系统何时知道；来源与查询：出处可回查，时间过滤实际启用</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">关系正确需要同时核对四项</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">身份与用途</text><text x="270" y="139" font-size="18" fill="#243b48">同一资产、同一职责，避免误合并</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">有效与获知</text><text x="270" y="239" font-size="18" fill="#243b48">现实何时变化，系统何时知道</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">来源与查询</text><text x="270" y="339" font-size="18" fill="#243b48">出处可回查，时间过滤实际启用</text></g></svg>
