<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">词重叠、哈希桶与真实向量</title><desc id="desc">词匹配：查询与正文的字词重叠；哈希向量：256 桶，可能碰撞，未学语义；评分结果：还含新近度等信号，不是真值概率</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">词重叠、哈希桶与真实向量</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">词匹配</text><text x="270" y="139" font-size="18" fill="#243b48">查询与正文的字词重叠</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">哈希向量</text><text x="270" y="239" font-size="18" fill="#243b48">256 桶，可能碰撞，未学语义</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">评分结果</text><text x="270" y="339" font-size="18" fill="#243b48">还含新近度等信号，不是真值概率</text></g></svg>
