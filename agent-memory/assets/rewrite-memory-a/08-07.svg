<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">候选规则的范围审查</title><desc id="desc">用户纠正：只看页面，不要替我提交；正确修订：真实授权才提交，演示保持只读；错误扩展：永久禁止陈禾使用 S7</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">候选规则的范围审查</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">用户纠正</text><text x="270" y="139" font-size="18" fill="#243b48">只看页面，不要替我提交</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">正确修订</text><text x="270" y="239" font-size="18" fill="#243b48">真实授权才提交，演示保持只读</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">错误扩展</text><text x="270" y="339" font-size="18" fill="#243b48">永久禁止陈禾使用 S7</text></g></svg>
