<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">读者的两条核验路径</title><desc id="desc">机制练习：写出候选与最终输入；实现复查：检查字段、调用和实际写操作；适用范围：虚构算例不等于在线实测</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">读者的两条核验路径</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">机制练习</text><text x="270" y="139" font-size="18" fill="#243b48">写出候选与最终输入</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">实现复查</text><text x="270" y="239" font-size="18" fill="#243b48">检查字段、调用和实际写操作</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">适用范围</text><text x="270" y="339" font-size="18" fill="#243b48">虚构算例不等于在线实测</text></g></svg>
