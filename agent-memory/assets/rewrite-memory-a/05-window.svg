<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">输入窗口的五项预算</title><desc id="desc">稳定部分：系统和工具说明：3000；已知与未来：当前 2500；输出与往返共 4500；记忆可用：12000-3000-2500-4500=2000</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">输入窗口的五项预算</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">稳定部分</text><text x="270" y="139" font-size="18" fill="#243b48">系统和工具说明：3000</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">已知与未来</text><text x="270" y="239" font-size="18" fill="#243b48">当前 2500；输出与往返共 4500</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">记忆可用</text><text x="270" y="339" font-size="18" fill="#243b48">12000-3000-2500-4500=2000</text></g></svg>
