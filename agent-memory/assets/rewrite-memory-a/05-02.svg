<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">精确标记与池外证据</title><desc id="desc">查询：certificate_check 或 CERT-17；全文：检查分词、别名与编号切分；边界：命中全文不代表已进入最终候选池</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">精确标记与池外证据</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">查询</text><text x="270" y="139" font-size="18" fill="#243b48">certificate_check 或 CERT-17</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">全文</text><text x="270" y="239" font-size="18" fill="#243b48">检查分词、别名与编号切分</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">边界</text><text x="270" y="339" font-size="18" fill="#243b48">命中全文不代表已进入最终候选池</text></g></svg>
