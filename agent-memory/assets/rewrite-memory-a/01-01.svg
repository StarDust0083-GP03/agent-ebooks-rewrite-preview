<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">外部记录与调用快照</title><desc id="desc">历史服务器：保留了昨日通知；当前输入：若无正文，模型没读到通知；下一次调用：显式加入要求，不用重新训练</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">外部记录与调用快照</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">历史服务器</text><text x="270" y="139" font-size="18" fill="#243b48">保留了昨日通知</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">当前输入</text><text x="270" y="239" font-size="18" fill="#243b48">若无正文，模型没读到通知</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">下一次调用</text><text x="270" y="339" font-size="18" fill="#243b48">显式加入要求，不用重新训练</text></g></svg>
