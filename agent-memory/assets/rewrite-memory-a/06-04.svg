<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">同名资产与别名映射</title><desc id="desc">北校区 S7：north-optics-s7；南校区 S7：同显示名，不同规范对象；别名：北区光谱七号可指向北校区同一资产</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">同名资产与别名映射</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">北校区 S7</text><text x="270" y="139" font-size="18" fill="#243b48">north-optics-s7</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">南校区 S7</text><text x="270" y="239" font-size="18" fill="#243b48">同显示名，不同规范对象</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">别名</text><text x="270" y="339" font-size="18" fill="#243b48">北区光谱七号可指向北校区同一资产</text></g></svg>
