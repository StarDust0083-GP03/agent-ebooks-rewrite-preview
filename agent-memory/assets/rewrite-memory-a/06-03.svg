<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" role="img" aria-labelledby="title desc"><title id="title">变化、分歧与提取错误</title><desc id="desc">真实交接：结束旧职责，开始新职责；来源分歧：保留双方证据，不能按晚到判真；抽取错误：把临时代班写成接任，撤回派生</desc><rect width="880" height="440" fill="#faf8f1"/><g font-family="Noto Sans CJK SC,system-ui,sans-serif"><text x="30" y="42" font-size="24" fill="#243b48">变化、分歧与提取错误</text><text x="45" y="90" font-size="16" fill="#536772">核对对象</text><text x="270" y="90" font-size="16" fill="#536772">具体状态与验收条件</text><rect x="28" y="110" width="824" height="88" fill="#e5ede9"/><text x="45" y="139" font-size="18" fill="#243b48">真实交接</text><text x="270" y="139" font-size="18" fill="#243b48">结束旧职责，开始新职责</text><rect x="28" y="210" width="824" height="88" fill="#e7edf2"/><text x="45" y="239" font-size="18" fill="#243b48">来源分歧</text><text x="270" y="239" font-size="18" fill="#243b48">保留双方证据，不能按晚到判真</text><rect x="28" y="310" width="824" height="88" fill="#e5ede9"/><text x="45" y="339" font-size="18" fill="#243b48">抽取错误</text><text x="270" y="339" font-size="18" fill="#243b48">把临时代班写成接任，撤回派生</text></g></svg>
